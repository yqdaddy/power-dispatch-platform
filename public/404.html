<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电力派单平台 · 架构设计</title>
    <script>
      // Single Page App redirect for GitHub Pages
      const path = window.location.pathname;
      const repo = '/power-dispatch-platform';
      if (path.startsWith(repo)) {
        sessionStorage.setItem('redirect', path.slice(repo.length) || '/');
        window.location.replace(repo + '/');
      }
    </script>
  </head>
  <body>
    <p>正在跳转...</p>
  </body>
</html>
